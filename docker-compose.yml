# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    # Keep Docker's stop window longer than the application's graceful shutdown.
    stop_grace_period: 130s
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - SHUTDOWN_TIMEOUT_SECONDS=120  # 应小于 stop_grace_period，允许在途请求优雅退出 (Must be lower than stop_grace_period so in-flight requests can drain)
#      - STREAMING_TIMEOUT=1200  # 有效 SSE data 事件间空闲超时；注释/PING 不重置 (Idle timeout between valid SSE data events; comments/PING do not reset it)
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - RELAY_DIAL_TIMEOUT_SECONDS=10  # TCP/代理建连超时；0 表示不限制 (TCP/proxy dial timeout; 0 disables)
#      - RELAY_TLS_HANDSHAKE_TIMEOUT_SECONDS=10  # TLS 握手超时；0 表示不限制 (TLS handshake timeout; 0 disables)
#      - RELAY_RESPONSE_HEADER_TIMEOUT_SECONDS=1140  # 先于1200秒总预算触发，并给1260秒外层反代留余量 (Fires before the 1200s total budget and leaves margin before a 1260s outer proxy)
#      - RELAY_EXPECT_CONTINUE_TIMEOUT_SECONDS=1  # Expect: 100-continue 等待超时 (Expect: 100-continue timeout)
#      - RELAY_FIRST_EVENT_TIMEOUT_SECONDS=1200  # 响应头后等待首个有效 SSE 事件，并受请求级总预算限制 (Per-attempt first valid event cap, bounded by request-wide budget)
#      - RELAY_FIRST_EVENT_TOTAL_TIMEOUT_SECONDS=1200  # 从入站开始、跨渠道尝试共享的首事件总预算 (Request-wide first-event budget shared across attempts)
#      - RELAY_NON_STREAM_TIMEOUT_SECONDS=1200  # 非流请求上传至完整响应体的总预算 (Total budget from non-stream upload through response-body read)
#      - RELAY_OUTER_PROXY_TIMEOUT_SECONDS=1260  # 已知外层代理预算，仅用于启动时校验层级 (Known outer-proxy budget used for startup validation)
#      - RELAY_STREAM_HEARTBEAT_SECONDS=15  # 仅首个有效事件后发送，首事件前不提交HTTP 200 (Heartbeat only after first valid event; never commits HTTP 200 beforehand)
#      - RELAY_PRE_FIRST_EVENT_HEARTBEAT_SECONDS=0  # 明确禁用首事件前写入 (Explicitly disable pre-first-event writes)
#      - ALI_TASK_POLL_REQUEST_TIMEOUT_SECONDS=60  # Ali异步任务单次轮询超时 (Per-request timeout for Ali asynchronous task polling)
#      - TASK_POLLING_REQUEST_TIMEOUT_SECONDS=1200  # 异步任务轮询请求级/单轮总预算 (Request-wide/cycle budget for asynchronous task polling)
#      - BACKGROUND_RELAY_TEXT_JOB_TIMEOUT_SECONDS=1260  # 后台文本Job外层预算，默认比1200秒Relay预算多60秒收尾 (Background text job envelope with 60s cleanup margin)
#      - BACKGROUND_RELAY_JOB_TIMEOUT_SECONDS=1260  # 其他后台Relay Job外层预算 (Outer envelope for other background Relay jobs)
#      - RELAY_TIMEOUT=0  # 旧配置：新响应头超时未设置时仅作为不超过1140秒的兼容回退 (Legacy response-header fallback capped at 1140s; no longer a whole-stream timeout)
#      - MAX_CONCURRENT_LARGE_REQUEST_BODIES=4  # 并发处理的 >=1 MiB 请求体上限，包含磁盘暂存请求 (Concurrent >=1 MiB body cap, including disk-spooled bodies)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # 启用 Secure session cookie，必须同时配置 SESSION_COOKIE_TRUSTED_URL (Enable Secure session cookies; requires SESSION_COOKIE_TRUSTED_URL)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # 可信 HTTPS 入口地址，多个用英文逗号分隔 (Trusted HTTPS entry URLs, comma-separated)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
